# Déploiement en un clic sur Render (https://render.com) : site + base PostgreSQL/PostGIS.
# Version de démonstration : paiement simulé, données fictives chargées au premier démarrage.
databases:
  - name: greliv-db
    plan: free
    databaseName: greliv
    user: greliv

services:
  - type: web
    name: greliv
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: greliv-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
